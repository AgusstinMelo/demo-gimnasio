<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="%URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="%URL%/" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Imagen del hero: se pide en paralelo con el JS para mejorar el LCP -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preload" as="image" imagesrcset="%HERO_SRCSET%" imagesizes="100vw" fetchpriority="high" />

    <script type="application/ld+json">%JSON_LD%</script>
  </head>
  <body class="grain">
    <div id="root"></div>
    <noscript><p style="padding:24px;color:#f5f1e8;background:#0a0a0a">FORJA · Gimnasio en Palermo. Escribinos por WhatsApp para reservar tu clase gratis.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
